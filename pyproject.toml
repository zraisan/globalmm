[project]
name = "globalmm"
version = "0.2.2"
description = "Build llama.cpp mmproj.gguf files for any LLM: closed-form in seconds, or a trained connector with bounding boxes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zain Raisan", email = "zain.kml.raisan@gmail.com" }]
keywords = ["llama.cpp", "mmproj", "siglip", "multimodal", "vision", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "gguf>=0.10",
    "pillow>=10.0",
    "numpy>=1.26",
    "ijson>=3.2",
]

[project.scripts]
globalmm = "globalmm.cli:main"

[project.urls]
Homepage = "https://github.com/zraisan/globalmm"
Source = "https://github.com/zraisan/globalmm"
Issues = "https://github.com/zraisan/globalmm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["globalmm"]

[tool.hatch.build.targets.sdist]
include = ["/globalmm", "/README.md", "/LICENSE", "/pyproject.toml"]
